name: CI

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Original commit for the manual walking-egress comparison'
        required: true
        default: '3dd6edaf17ece0cc41e363cf1280f3019a50deae'
        type: string
  push:
    paths:
      - java-r5rcore/**
      - r-package/**
      - .github/workflows/**

jobs:
  build-jar:
    env:
      GH_TOKEN: ${{ github.token }}

    # pinned: the R packages below are Ubuntu 24.04 (noble) binaries
    runs-on: ubuntu-24.04

    # the job commits the rebuilt JAR back to the branch
    permissions:
      contents: write

    # don't build on merges to master
    if: ${{ !github.ref_protected }}

    steps:
      - uses: actions/checkout@v5
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
#        with:
#          use-public-rspm: true # this no longer works as of September 2025

      - name: Install R packages
        run: |
          # this specification is necessary for some reason as of September 2025
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"))
          install.packages(c('devtools', 'remotes'))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
        working-directory: r-package

      - name: Install system dependencies
        run: |
          while read -r cmd
          do
            eval sudo $cmd
          done < <(Rscript -e 'writeLines(remotes::system_requirements("ubuntu", "20.04"))')
        working-directory: r-package

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew build
        working-directory: java-r5rcore

      - name: Create pull request
        # https://github.com/actions/checkout/pull/1184
        run: |
          NEW_JAR="java-r5rcore/build/libs/java-r5rcore-*.jar"
          TARGET_JAR="r-package/inst/jar/r5r.jar"
        
          new_sha=$(sha256sum $NEW_JAR | awk '{print $1}')
          # ensure file exists and then compute sha
          old_sha=$( [ -f "$TARGET_JAR" ] && sha256sum "$TARGET_JAR" | awk '{print $1}' || echo "" )
          
          echo "NEW: $new_sha"
          echo "OLD: $old_sha"
          
          # Only push if sha different
          if [ "$new_sha" != "$old_sha" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
            echo "JAR changed — updating."
            mv $NEW_JAR $TARGET_JAR
            git add $TARGET_JAR
            git commit -m "Rebuild JAR for commit ${GITHUB_SHA}"
            git push
          else
            echo "JAR unchanged — skipping commit."
          fi

  R-CMD-check:
    needs: build-jar

    runs-on: ${{ matrix.config.os }}

    name: R-CMD-check ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: macOS-latest, r: 'release'}
          - {os: ubuntu-22.04, r: 'devel', rspm: "https://packagemanager.rstudio.com/cran/__linux__/jammy/latest"}
          - {os: ubuntu-22.04, r: 'release', rspm: "https://packagemanager.rstudio.com/cran/__linux__/jammy/latest"}
          - {os: ubuntu-22.04, r: 'oldrel', rspm: "https://packagemanager.rstudio.com/cran/__linux__/jammy/latest"}

    env:
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync to latest HEAD including rebuilt JAR
        run: |
          git fetch origin "${{ github.ref_name }}"
          git checkout "${{ github.ref_name }}"
          git pull origin "${{ github.ref_name }}"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - uses: r-lib/actions/setup-pandoc@v2

      # Java setup for macOS (using the proper arm64 architecture)
      - name: Java setup (macOS)
        if: runner.os == 'macOS'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          architecture: arm64

      # Java setup for non-macOS runners
      - name: Java setup (non-macOS)
        if: runner.os != 'macOS'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: r-package

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r-package

  R-CMD-check-CRAN:
    needs: build-jar

    runs-on: ${{ matrix.config.os }}

    name: R-CMD-check-CRAN

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-22.04, r: 'release', rspm: "https://packagemanager.rstudio.com/cran/__linux__/jammy/latest"}

    env:
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync to latest HEAD including rebuilt JAR
        run: |
          git fetch origin "${{ github.ref_name }}"
          git checkout "${{ github.ref_name }}"
          git pull origin "${{ github.ref_name }}"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: r-package

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r-package
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          NOT_CRAN: false

  test-coverage:
    needs: build-jar

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync to latest HEAD including rebuilt JAR
        run: |
          git fetch origin "${{ github.ref_name }}"
          git checkout "${{ github.ref_name }}"
          git pull origin "${{ github.ref_name }}"

      - uses: r-lib/actions/setup-r@v2

      - name: Java setup
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage
          working-directory: r-package

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}
        working-directory: r-package

      - uses: codecov/codecov-action@v7
        with:
          # Fail on upload error only when a token is set (forks have none)
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: r-package

  walking-egress:
    # Keep the historical two-package/300-pair audit opt-in. The physical Java
    # regressions and testthat checks still run in ordinary CI.
    if: github.event_name == 'workflow_dispatch'
    needs: build-jar
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sync CI-built bridge
        run: |
          git fetch origin "${{ github.ref_name }}"
          git checkout "${{ github.ref_name }}"
          git pull --ff-only origin "${{ github.ref_name }}"
          git rev-parse HEAD
          sha256sum r-package/inst/jar/r5r.jar
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r-package
          extra-packages: any::devtools
      - uses: gradle/actions/setup-gradle@v6
      - name: Synthetic baseline must fail the physical assertions
        working-directory: java-r5rcore
        run: |
          set +e
          ./gradlew egressRegression -PbaselineEgress > baseline-egress.log 2>&1
          status=$?
          set -e
          cat baseline-egress.log
          test "$status" -ne 0
          grep -q 'FAIL: near endpoint gets its own directed' baseline-egress.log
          grep -q 'FAIL: known final leg' baseline-egress.log
          grep -q 'FAIL: final geometry reaches requested destination' baseline-egress.log
      - name: Corrected physical regressions
        working-directory: java-r5rcore
        run: ./gradlew egressRegression
      - name: Install original master in isolated library
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/egress-baseline-source" "$RUNNER_TEMP/egress-baseline-lib"
          baseline_commit=$(git rev-parse --verify --end-of-options "$BASELINE_REF^{commit}")
          echo "Baseline commit: $baseline_commit"
          git archive "$baseline_commit" -- r-package | tar -x -C "$RUNNER_TEMP/egress-baseline-source"
          R CMD INSTALL --library="$RUNNER_TEMP/egress-baseline-lib" "$RUNNER_TEMP/egress-baseline-source/r-package"
      - name: Measure upstream master egress on both algorithms
        run: Rscript --vanilla .github/scripts/check-walking-egress.R --baseline
        env:
          EGRESS_BASELINE_LIB: ${{ runner.temp }}/egress-baseline-lib
          EGRESS_EXPECTED_BRIDGE: ${{ runner.temp }}/egress-baseline-source/r-package/inst/jar/r5r.jar
      - name: Install corrected package
        run: R CMD INSTALL r-package
      - name: Corrected POA routes and 300-pair audit for both algorithms
        run: Rscript --vanilla .github/scripts/check-walking-egress.R
        env:
          EGRESS_EXPECTED_BRIDGE: r-package/inst/jar/r5r.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walking-egress-synthetic
          path: java-r5rcore/baseline-egress.log
